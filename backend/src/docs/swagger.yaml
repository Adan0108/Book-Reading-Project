openapi: 3.0.0
info:
  title: Book Reading Project API
  version: 1.0.0
  description: API documentation for the Book Reading Project authentication system
servers:
  - url: http://localhost:3000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: RS256 JWT
    clientId:
      type: apiKey
      in: header
      name: x-client-id
      description: User ID required for authentication
    refreshCookie:
      type: apiKey
      in: cookie
      name: rt
    accessCookie:
      type: apiKey
      in: cookie
      name: at

tags:
  - name: Authentication
    description: User registration, login, and security endpoints

paths:
  # ==========================================
  # PUBLIC ROUTES
  # ==========================================
  /v1/api/access/register-email:
    post:
      tags: [Authentication]
      summary: Step 1 - Register via Email
      description: Creates an inactive user and sends an OTP to the email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: testuser@example.com
      responses:
        200:
          description: Verification code sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Verification code sent.
                  metadata:
                    type: object
                    properties:
                      cooldown:
                        type: integer
                        example: 60
        400:
          description: Missing email or cooldown active
        409:
          description: Email already registered

  /v1/api/access/verify-email:
    post:
      tags: [Authentication]
      summary: Step 2 - Verify Email OTP
      description: Verifies the OTP sent to the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                  example: testuser@example.com
                otp:
                  type: string
                  example: "123456"
      responses:
        200:
          description: Email verified; metadata.setupToken contains a single-use proof valid for ten minutes
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      setupToken:
                        type: string
                        pattern: '^[a-f0-9]{64}$'
        400:
          description: Invalid OTP or User not found
        401:
          description: Too many failed attempts

  /v1/api/access/setup-password:
    post:
      tags: [Authentication]
      summary: Step 3 - Setup Password & Profile
      description: Finalizes registration by setting password and username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, username, setupToken]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 12
                  description: Maximum 72 UTF-8 bytes
                  example: "StrongPass123!"
                setupToken:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                username:
                  type: string
                  example: "bookworm99"
      responses:
        201:
          description: Account created successfully
        400:
          description: Missing fields

  /v1/api/access/resend-otp:
    post:
      tags: [Authentication]
      summary: Resend Registration OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: OTP resent successfully
        400:
          description: Cooldown active

  /v1/api/access/login:
    post:
      tags: [Authentication]
      summary: User Login
      description: Returns a fifteen-minute access token and sets HttpOnly access and refresh cookies. Refresh tokens are never returned in JSON. Auth responses are not cacheable; rate limiting returns 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: testuser@example.com
                password:
                  type: string
                  format: password
                  example: "StrongPass123!"
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: LoginOK
                  metadata:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                      tokens:
                        type: object
                        properties:
                          accessToken:
                            type: string
        400:
          description: Missing credentials
        401:
          description: Invalid credentials or Account not active

  /v1/api/access/forgot-password:
    post:
      tags: [Authentication]
      summary: Request Password Reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Reset code sent
        400:
          description: Email not found or inactive

  /v1/api/access/reset-password:
    post:
      tags: [Authentication]
      summary: Reset Password with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        200:
          description: Password reset successfully
        401:
          description: Invalid OTP

  # ==========================================
  # PROTECTED ROUTES
  # ==========================================
  /v1/api/access/logout:
    post:
      tags: [Authentication]
      summary: Logout (Protected)
      security:
        - bearerAuth: []
          clientId: []
      parameters:
        - in: header
          name: x-client-id
          schema:
            type: integer
          required: true
          description: User ID
      responses:
        200:
          description: Logout successful
        401:
          description: Unauthorized (Invalid Token/Client ID)

  /v1/api/access/refresh:
    post:
      tags: [Authentication]
      summary: Refresh Tokens
      description: Atomically rotates the refresh cookie and returns a new access token. Reuse revokes this session family. All active sessions are revoked after password reset.
      security:
        - clientId: []
          refreshCookie: []
      parameters:
        - in: header
          name: x-client-id
          schema:
            type: integer
          required: true
          description: User ID
      responses:
        200:
          description: Tokens refreshed successfully
        401:
          description: Invalid Refresh Token or Client ID
        403:
          description: Untrusted browser origin

  /v1/api/access/session:
    post:
      tags: [Authentication]
      summary: Restore the same unexpired access token without refresh rotation
      security:
        - clientId: []
          accessCookie: []
      responses:
        200:
          description: metadata.tokens.accessToken contains the validated existing access token; no cookie is renewed
        401:
          description: Access cookie expired, revoked or invalid; attempt refresh once
        403:
          description: Untrusted browser origin

  /v1/api/access/logout-all:
    post:
      tags: [Authentication]
      summary: Revoke all user sessions and clear browser cookies
      security:
        - bearerAuth: []
          clientId: []
      responses:
        200:
          description: All existing access and refresh tokens are denied on subsequent requests
        401:
          description: Invalid access token or client ID
